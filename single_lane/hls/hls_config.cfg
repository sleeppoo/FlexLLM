# Set part to the exact V80/XCV80 device string installed in your Vivado release.
part=REPLACE_WITH_INSTALLED_XCV80_PART

[hls]
clock=300MHz
flow_target=vivado
syn.top=dot3_lane_top
syn.file=dot3_lane_top.cpp
# Synthesize PE_PER_LANE=1,2,4,8 in separate work directories by changing the
# first macro. Set ENABLE_ACCUM=1 to verify the fabric accumulator variant.
syn.file_cflags=dot3_lane_top.cpp,-I../include -std=c++17 -DPE_PER_LANE=4 -DENABLE_ACCUM=0 -DACC_WIDTH=32
syn.blackbox.file=../blackbox/dsp58_dot3_int8.json
tb.file=../tests/tb_dot3_lane_hls.cpp
tb.file_cflags=../tests/tb_dot3_lane_hls.cpp,-I../include -std=c++17
package.output.format=ip_catalog
package.output.syn=false
